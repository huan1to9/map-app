<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>AlmaMap — Карта Алматы</title> <!-- Leaflet CSS --> <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" /> <!-- FontAwesome --> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" /> <link rel="stylesheet" href="styles.css" /> </head> <body> <div class="app"> <!-- ===================== БОКОВАЯ ПАНЕЛЬ ===================== --> <aside class="sidebar"> <!-- Шапка --> <header class="sidebar__header"> <div class="logo"> <span class="logo__icon"><i class="fa-solid fa-map-location-dot"></i></span> <span class="logo__text">Alma<strong>Map</strong></span> </div> <!-- Поисковая строка --> <div class="search"> <i class="fa-solid fa-magnifying-glass search__icon"></i> <input type="text" id="searchInput" class="search__input" placeholder="Поиск: кафе, парк, ТРЦ…" autocomplete="off" /> <button id="clearSearch" class="search__clear" title="Очистить"> <i class="fa-solid fa-xmark"></i> </button> </div> <!-- Чипсы-категории --> <div class="chips" id="chips"> <button class="chip chip--active" data-category="all"> <i class="fa-solid fa-layer-group"></i> Все </button> <button class="chip" data-category="cafe"> <i class="fa-solid fa-mug-hot"></i> Кафе </button> <button class="chip" data-category="park"> <i class="fa-solid fa-tree"></i> Парки </button> <button class="chip" data-category="mall"> <i class="fa-solid fa-bag-shopping"></i> ТРЦ </button> <button class="chip" data-category="atm"> <i class="fa-solid fa-money-bill-wave"></i> Банкоматы </button> </div> </header> <!-- Статусная плашка управления речью --> <div class="speech-bar" id="speechBar" hidden> <span class="speech-bar__anim"><i class="fa-solid fa-volume-high"></i></span> <span class="speech-bar__text" id="speechText">Озвучиваю…</span> <button class="speech-bar__stop" id="stopSpeech" title="Остановить озвучку"> <i class="fa-solid fa-stop"></i> Остановить </button> </div> <!-- Список результатов --> <div class="results-meta" id="resultsMeta"></div> <div class="cards" id="cardsList"></div> </aside> <!-- ===================== КАРТА ===================== --> <main class="map-wrap"> <div id="map"></div> <!-- Кнопка геолокации --> <button class="geo-btn" id="geoBtn" title="Моё местоположение"> <i class="fa-solid fa-location-crosshairs"></i> </button> </main> </div> <!-- Leaflet JS --> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" ></script> <script src="app.js"></script> </body> </html>
